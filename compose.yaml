services:
  dashboard:
    build: .
    network_mode: host
    env_file: .env
    environment:
      DASHBOARD_PORT: "18768"
      DELTA_STATE_DIR: /var/lib/delta-strategy
    volumes:
      - strategy-state:/var/lib/delta-strategy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:18768/api/strategy', timeout=3).close()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  strategy-state:
